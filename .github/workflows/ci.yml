name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e

  desktop:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run desktop:smoke
      - name: Package with obsolete development outputs present
        run: |
          touch dist/src/obsolete-service.js dist/ui/obsolete-renderer.js
          npm run desktop:package
          test -f dist/src/obsolete-service.js
          test -f dist/ui/obsolete-renderer.js
      - name: Verify and launch the archived app
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          archive="Argent-${version}-macos-arm64.zip"
          (cd release && shasum -a 256 "$archive" | cmp - "$archive.sha256")
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          /usr/bin/ditto -x -k "release/$archive" "$extracted"
          app_dist="$extracted/Argent.app/Contents/Resources/app/dist"
          test ! -e "$app_dist/src/obsolete-service.js"
          test ! -e "$app_dist/ui/obsolete-renderer.js"
          ARGENT_PACKAGED_EXECUTABLE="$extracted/Argent.app/Contents/MacOS/Argent" npm run desktop:smoke
